<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holistic Decisions — Coming Soon</title>
<meta name="description" content="Holistic Decisions — tailored simulation solutions. Our new website is coming soon. Think Forward.">

<meta name="theme-color" content="#0F8E8B">
<link rel="icon" type="image/svg+xml" href="hd-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Readex Pro: closest free match to the brand face "29LT Bukra" (geometric, Latin + Arabic) -->
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Brand tokens (HD Brand Book 2025, "Color Pallette") ─────── */
  :root {
    --teal:      #0F8E8B;   /* main color 01 — C83 M25 Y48 K3        */
    --teal-ink:  #0B6F6C;   /* teal darkened for small text (AA)      */
    --teal-deep: #0A6462;   /* footer band                            */
    --beige:     #FFD289;   /* main color 02 — C0 M18 Y53 K0          */
    --beige-2:   #FFE3B5;   /* logo's lower beige                     */
    --mist:      #ECF4F3;   /* the brand book's corner chevrons       */
    --ink:       #46585A;   /* body text                              */
    --bg:        #FFFFFF;
    --line:      rgba(15, 142, 139, .28);

    --f: "Readex Pro", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ── Stage ──────────────────────────────────────────────────── */
  .stage {
    position: relative;
    flex: 1;
    display: grid;
    place-items: center;
    padding: clamp(40px, 8vh, 80px) 16px clamp(28px, 5vh, 48px);
    overflow: hidden;
    isolation: isolate;
  }
  .center { display: flex; flex-direction: column; align-items: center; text-align: center; }

  /* Signature corner chevrons — the "think forward" arrow from every Brand Book page */
  .chevrons {
    position: absolute;
    top: 0; left: 0;
    width: clamp(220px, 34vw, 460px);
    height: auto;
    z-index: -1;
    pointer-events: none;
  }
  .chevrons path { fill: none; stroke: var(--mist); stroke-width: 34; stroke-linejoin: round; }
  .chevrons.br { top: auto; left: auto; right: 0; bottom: 0; transform: rotate(180deg); width: clamp(160px, 22vw, 300px); }

  /* Logo — official artwork, vectorised from the Brand Book */
  .logo { width: clamp(150px, 22vw, 200px); height: auto; display: block; }

  /* Headline — Brand Book heading style: beige chevron + light/bold teal */
  h1 {
    margin-top: clamp(36px, 6vh, 56px);
    display: inline-flex;
    align-items: center;
    gap: clamp(10px, 1.6vw, 16px);
    font-weight: 300;
    font-size: clamp(27px, 4.4vw, 44px);
    line-height: 1.15;
    letter-spacing: -.01em;
    color: var(--teal);
  }
  h1 b { font-weight: 600; }
  .chev { width: .55em; height: auto; flex: none; fill: var(--beige); }

  .status {
    margin-top: 14px;
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 400; color: var(--ink);
  }
  .dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--beige); }
  .dot::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: var(--beige); animation: ping 2.4s ease-out infinite;
  }
  @keyframes ping { to { transform: scale(3); opacity: 0; } }

  /* Contact */
  .actions { margin-top: 32px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    height: 48px;
    padding: 0 22px;
    border-radius: 12px;
    font: 500 15px/1 var(--f);
    text-decoration: none;
    transition: transform .2s ease, background-color .2s ease, border-color .2s ease;
  }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn-primary { background: var(--teal-ink); color: #fff; }
  .btn-primary:hover { background: var(--teal); transform: translateY(-1px); }
  .btn-primary .go { color: var(--beige); transition: transform .25s ease; }
  .btn-primary:hover .go { transform: translateX(4px); }
  .btn-icon { color: var(--teal-ink); border: 1.5px solid var(--line); padding: 0 16px; }
  .btn-icon b { font-size: 12px; font-weight: 600; letter-spacing: .1em; }
  .btn-icon:hover { border-color: var(--teal); background: rgba(15, 142, 139, .05); transform: translateY(-1px); }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

  /* ── Footer — the stationery's rising "growth" band ─────────── */
  .band { display: block; width: 100%; height: clamp(44px, 7vw, 84px); }
  .strip {
    background: var(--teal-deep);
    color: #fff;
    padding: 4px 16px 16px;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 26px;
    font-size: 12.5px; font-weight: 400;
  }
  .strip .url { letter-spacing: .22em; font-weight: 500; }
  .strip .tf { display: inline-flex; align-items: center; gap: 8px; letter-spacing: .18em; font-weight: 500; }
  .strip .tf svg { width: 16px; height: 12px; fill: var(--beige); }
  .strip .meta { color: rgba(255, 255, 255, .72); }

  .btn-label-short { display: none; }
  @media (max-width: 480px) {
    .btn-label { display: none; }
    .btn-label-short { display: inline; }
    .actions { gap: 10px; }
    .strip .meta { flex-basis: 100%; text-align: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <main class="stage">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>

      </div>

  <footer>
    <!-- Rising band: beige stripe over teal, the Brand Book stationery motif -->
    <svg class="band" viewBox="0 0 1440 100" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#FFD289" d="M0 76 L640 46 L720 70 L1440 0 V20 L720 90 L640 66 L0 96 Z"/>

      <span class="url">WWW.HOLISTICDECISIONS.CA</span>
