<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holistic Decisions — Coming Soon</title>
<meta name="description" content="Holistic Decisions — tailored simulation solutions. Our new website is coming soon. Think Forward.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B5654">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon-v1.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Readex Pro: closest free match to the brand face "29LT Bukra" -->
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Brand tokens (HD Brand Book 2025) ──────────────────────── */
  :root {
    --teal:      #0F8E8B;   /* brand main color 01                 */
    --teal-800:  #0B5654;   /* brand teal, deepened for the canvas */
    --teal-950:  #073D3C;   /* canvas edge                         */
    --mint:      #8FD3CF;   /* light brand teal — waves, accents   */
    --beige:     #FFD289;   /* brand main color 02                 */
    --cream:     #FBEFD9;   /* footer strip                        */
    --ink:       #173D3C;   /* text on cream                       */
    --text:      #F7F3EA;
    --text-dim:  rgba(247, 243, 234, .74);
    --line:      rgba(143, 211, 207, .3);

    --f: "Readex Pro", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(70% 60% at 50% 42%, #0F7472 0%, transparent 70%),
      linear-gradient(170deg, var(--teal-800) 0%, var(--teal-950) 100%);
    background-color: var(--teal-800);
    color: var(--text);
    font-family: var(--f);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ── Stage ──────────────────────────────────────────────────── */
  .stage {
    position: relative;
    flex: 1;
    display: grid;
    place-items: center;
    padding: clamp(32px, 7vh, 72px) 16px;
    isolation: isolate;
    overflow: hidden;
  }
  .center { display: flex; flex-direction: column; align-items: center; text-align: center; }

  /* Forward waves — the logo's "D" arcs, radiating outward */
  .waves {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(1200px, 190vw);
    aspect-ratio: 1;
    transform: translate(-46%, -50%);
    z-index: -1;
    pointer-events: none;
  }
  .waves path { fill: none; transform-box: fill-box; transform-origin: left center; }
  .waves .w { stroke: var(--mint); stroke-width: 3; opacity: 0; animation: wave 7.5s cubic-bezier(.3,.6,.4,1) infinite; }
  .waves .w:nth-child(2) { animation-delay: 1.5s; }
  .waves .w:nth-child(3) { animation-delay: 3s; }
  .waves .w:nth-child(4) { animation-delay: 4.5s; }
  .waves .w:nth-child(5) { animation-delay: 6s; }
  @keyframes wave {
    0%   { transform: scale(.35); opacity: 0; }
    15%  { opacity: .2; }
    100% { transform: scale(1);   opacity: 0; }
  }

  /* Official logo (vectorised from the Brand Book), on-teal colorway */
  .logo { width: clamp(150px, 21vw, 196px); height: auto; display: block; filter: drop-shadow(0 18px 40px rgba(0, 0, 0, .22)); }

  /* Message — one line only, led by the pulsing beige dot */
  h1 {
    margin-top: clamp(36px, 6vh, 56px);
    display: inline-flex; align-items: center; gap: clamp(12px, 1.6vw, 18px);
    font-weight: 300;
    font-size: clamp(24px, 3.8vw, 38px);
    line-height: 1.15;
    letter-spacing: -.01em;
    color: #FFFFFF;
  }
  .dot { position: relative; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--beige); }
  .dot::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: var(--beige); animation: ping 2.2s ease-out infinite;
  }
  @keyframes ping { to { transform: scale(3); opacity: 0; } }

  /* Contact — one email button */
  .actions { margin-top: clamp(26px, 4vh, 36px); display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    height: 50px;
    padding: 0 24px;
    border-radius: 999px;
    font: 500 15px/1 var(--f);
    text-decoration: none;
    transition: transform .2s ease, background-color .2s ease, border-color .2s ease;
  }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn-primary { background: var(--beige); color: var(--ink); }
  .btn-primary:hover { background: #FFDDA3; transform: translateY(-1px); }
  .btn:focus-visible { outline: 2px solid var(--beige); outline-offset: 3px; }

  /* ── Cream strip — the card's URL band ──────────────────────── */
  .strip {
    background: var(--cream);
    color: var(--ink);
    padding: 14px 16px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 22px;
    font-size: 12.5px; font-weight: 400;
  }
  .strip .url { letter-spacing: .2em; font-weight: 500; color: var(--teal-800); }
  .strip .meta { color: rgba(23, 61, 60, .72); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .waves .w { opacity: .12; transform: none; }
  }
</style>
</head>
<body>

  <main class="stage">

    <!-- Forward waves, radiating from the mark -->
    <svg class="waves" viewBox="0 0 400 400" aria-hidden="true">
      <path class="w" d="M200 20 A180 180 0 0 1 200 380"/>
      <path class="w" d="M200 20 A180 180 0 0 1 200 380"/>
      <path class="w" d="M200 20 A180 180 0 0 1 200 380"/>
      <path class="w" d="M200 20 A180 180 0 0 1 200 380"/>
      <path class="w" d="M200 20 A180 180 0 0 1 200 380"/>
    </svg>

    <div class="center">
      <img class="logo" src="hd-logo-on-teal.svg" width="492" height="596" alt="Holistic Decisions — Think Forward">

      <h1><span class="dot" aria-hidden="true"></span>New website coming soon</h1>

      <div class="actions">
        <a class="btn btn-primary" href="mailto:hamzea@holisticdecisions.ca" title="hamzea@holisticdecisions.ca">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          Contact us
        </a>
      </div>
    </div>

  </main>

  <footer class="strip">
    <span class="url">WWW.HOLISTICDECISIONS.CA</span>
    <span class="meta">Brampton, Ontario, Canada · © <span id="yr">2026</span></span>
  </footer>

  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
